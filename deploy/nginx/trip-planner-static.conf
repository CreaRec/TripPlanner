# Crea Trip Planner — static pages for /trip-planner/*
# Include inside an existing HTTPS server { } block:
#   include /etc/nginx/snippets/crea-trip-planner-static.conf;
# Replace __APP_DIR__ with the deploy directory (default /home/crearec/crea-trip-planner).

location /trip-planner/ {
  alias __APP_DIR__/web/trip-planner/;
  index index.html;
}
