# Crea Trip Planner — OAuth callback proxy for /trip-planner/oauth/*
# Include inside the same HTTPS server { } block as trip-planner-static.conf:
#   include /etc/nginx/snippets/crea-trip-planner-oauth.conf;
# Replace __HTTP_PORT__ with HTTP_PORT from .env (default 3000; Compose binds 127.0.0.1).
# Public paths use /trip-planner/oauth/; the Node app serves the same handlers at /oauth/.

location /trip-planner/oauth/ {
  proxy_pass http://127.0.0.1:__HTTP_PORT__/oauth/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /trip-planner/health {
  proxy_pass http://127.0.0.1:__HTTP_PORT__/health;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
