services:
  db:
    image: pgvector/pgvector:pg16
    container_name: crea-trip-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trip}
      POSTGRES_DB: ${POSTGRES_DB:-tripplanner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trip} -d ${POSTGRES_DB:-tripplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    image: ${IMAGE:-ghcr.io/crearec/crea-trip-planner}:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-trip}:${POSTGRES_PASSWORD:-trip}@db:5432/${POSTGRES_DB:-tripplanner}?schema=public
      DATA_DIR: /app/data/exports
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: crea-trip-planner
      OTEL_SERVICE_NAMESPACE: bots
      OTEL_SERVICE_VERSION: ${IMAGE_TAG:-main}
      OTEL_DEPLOYMENT_ENVIRONMENT: production
    ports:
      - "127.0.0.1:${HTTP_PORT:-3000}:3000"
    volumes:
      - ./data/exports:/app/data/exports
    networks:
      - default
      - lgtm

networks:
  lgtm:
    external: true
